function fmt(n){return (n>0?'+':'')+n.toLocaleString();}
function etfSummary(){var din=D.etf_in||[],dout=D.etf_out||[];if(!din.length&&!dout.length){return;}
 function col(title,rows,up){var h='<div class="cc"><div class="ch" style="color:'+(up?'#ff5252':'#26a69a')+'">'+title+'</div>';
  rows.forEach(function(r,i){h+='<div class="er"><span><span class="rk">'+(i+1)+'.</span> '+r[0]+' '+r[1]+' <span class="etfn">🐟'+r[3]+'</span></span><span class="'+(up?'up':'dn')+'">'+(r[2]>0?'+':'')+r[2]+'億</span></div>';});
  return h+'</div>';}
 document.getElementById('etfsum').innerHTML='<h2>🐟 5檔主動式ETF今日動向（'+(D.etf_asof||'')+'）</h2><div class="cols">'
  +col('▲ 加碼最多 前十',din,true)+col('▼ 出貨最多 前十',dout,false)+'</div>';}
function secs(){var h='';D.order.forEach(function(s){var c=D.col[s]||'#3a4a6a';h+='<button class="secb" style="background:'+c+'" data-s="'+s+'">'+s+'</button>';});document.getElementById('secs').innerHTML=h;
 document.querySelectorAll('.secb').forEach(function(b){b.onclick=function(){selSec(b.getAttribute('data-s'));};});}
function metric(c){return sortMode==='etf'?(D.stock[c].etfyi||0):(D.stock[c].pct!=null?D.stock[c].pct:-999);}
function selSec(s){curSec=s;document.querySelectorAll('.secb').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===s);});
 var list=(D.sectors[s]||[]).slice().sort(function(a,b){return metric(b)-metric(a);});
 var mx=1;list.forEach(function(c){mx=Math.max(mx,Math.abs(metric(c)));});
 var h='';list.forEach(function(c){var st=D.stock[c];var m=metric(c);var pos=m>=0;
  var w=Math.min(100,Math.abs(m)/mx*100);var col=pos?'#c0152b':'#1a7a5e';var side=pos?'left:50%':'right:50%';
  var valtxt;
  if(sortMode==='etf'){valtxt=(st.etfyi!=null&&st.etfyi!=0?(st.etfyi>0?'+':'')+st.etfyi+'億':'—')+' <span style="font-size:11px;color:#8fa3c1">('+(st.pct!=null?(st.pct>=0?'+':'')+st.pct+'%':'-')+')</span>';}
  else{valtxt=(st.pct!=null?(st.pct>=0?'+':'')+st.pct+'%':'—')+' <span style="font-size:11px;color:#8fa3c1">('+fmt(st.cur)+'張)</span>';}
  h+='<a class="row" data-c="'+c+'"><span class="nm">'+c+' '+st.nm+'</span><span class="bar"><span class="fill" style="'+side+';width:'+(w/2)+'%;background:'+col+'"></span></span><span class="val '+(pos?'up':'dn')+'">'+valtxt+'</span><span class="etf">'+etfBadge(st)+'</span></a>';});
 var lab=sortMode==='etf'?'主動ETF今日加碼<b>億元</b>':'本週三大買超<b>佔量%</b>';
 document.getElementById('rankh').innerHTML=s+'　'+list.length+' 檔（'+lab+'排名）';
