 document.querySelectorAll('.secb').forEach(function(b){b.onclick=function(){selSec(b.getAttribute('data-s'));};});}
function metric(c){return sortMode==='etf'?(D.stock[c].etfyi||0):(D.stock[c].pct!=null?D.stock[c].pct:-999);}
function selSec(s){curSec=s;document.querySelectorAll('.secb').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===s);});
 var list=(D.sectors[s]||[]).slice().sort(function(a,b){return metric(b)-metric(a);});
 var mx=1;list.forEach(function(c){mx=Math.max(mx,Math.abs(metric(c)));});
 var h='';list.forEach(function(c){var st=D.stock[c];var m=metric(c);var pos=m>=0;
  var w=Math.min(100,Math.abs(m)/mx*100);var col=pos?'#c0152b':'#1a7a5e';var side=pos?'left:50%':'right:50%';
  var valtxt;
  if(sortMode==='etf'){valtxt=(st.etfyi!=null&&st.etfyi!=0?(st.etfyi>0?'+':'')+st.etfyi+'億':'—')+' <span style="font-size:11px;color:#8fa3c1">('+(st.pct!=null?(st.pct>=0?'+':'')+st.pct+'%':'-')+')</span>';}
  else{valtxt=(st.pct!=null?(st.pct>=0?'+':'')+st.pct+'%':'—')+' <span style="font-size:11px;color:#8fa3c1">('+fmt(st.cur)+'張)</span>';}
  h+='<a class="row" data-c="'+c+'"><span class="nm">'+c+' '+st.nm+'</span><span class="bar"><span class="fill" style="'+side+';width:'+(w/2)+'%;background:'+col+'"></span></span><span class="val '+(pos?'up':'dn')+'">'+valtxt+'</span><span class="etf">'+etfBadge(st)+'</span></a>';});
 var lab=sortMode==='etf'?'主動ETF今日加碼<b>億元</b>':'本週三大買超<b>佔量%</b>';
 document.getElementById('rankh').innerHTML=s+'　'+list.length+' 檔（'+lab+'排名）';
 document.getElementById('ranklist').innerHTML=h;
 document.querySelectorAll('.row').forEach(function(r){r.onclick=function(){selStock(r.getAttribute('data-c'));};});}
function etfBadge(st){if(!st.etfn)return '';var y=st.etfyi;
 var d=(y!=null&&y!=0)?('<span class="'+(y>0?'up':'dn')+'">'+(y>0?'▲+':'▼')+y+'億</span>'):'';
 return '<span class="etfn" title="'+st.etfn+'檔主動式ETF持有">🐟'+st.etfn+'</span>'+d;}
function selStock(c){curStock=c;document.querySelectorAll('.row').forEach(function(r){r.classList.toggle('sel',r.getAttribute('data-c')===c);});
 var st=D.stock[c];var mx=1;st.wk.forEach(function(w){mx=Math.max(mx,Math.abs(w[1]));});
 var bars='';st.wk.forEach(function(w){var v=w[1];var hh=Math.abs(v)/mx*90;var col=v>=0?'#c0152b':'#1a7a5e';
  bars+='<div class="wkcol"><div class="vv '+(v>=0?'up':'dn')+'">'+(v?fmt(v):'')+'</div><div class="b" style="height:'+hh+'%;background:'+col+'"></div><div class="lb">'+w[0]+(w[2]!=null?'<br>'+w[2]+'%':'')+'</div></div>';});
 var rows='';st.d5.forEach(function(r){function cl(x){return '<td class="'+(x>=0?'up':'dn')+'">'+fmt(x)+'</td>';}
  rows+='<tr><td>'+r[0]+'</td>'+cl(r[1])+cl(r[2])+cl(r[3])+cl(r[4])+'<td>'+(r[5]!=null?r[5]+'%':'-')+'</td></tr>';});
 var etfcard='';if(st.etfn){var y=st.etfyi;
   var yline=(y!=null)?('今日主動ETF淨'+(y>=0?'加碼 <span class="up">+'+y+'億</span>':'減碼 <span class="dn">'+y+'億</span>')):'今日無變化';
   etfcard='<div class="card"><h3>🐟 主動式ETF（聰明錢）</h3><div class="hint">主線：5檔規模最大台股主動式ETF（統一/復華/群益）</div>'
    +'<div style="font-size:15px;line-height:2"><b>'+st.etfn+'</b> 檔主動式ETF持有此股　｜　'+yline+'</div></div>';}
 document.getElementById('detail').innerHTML='<div class="card"><h3>'+c+' '+st.nm+'　<span style="font-size:12px;color:#9fb3d1">'+st.sec+'</span></h3>'
  +'<div class="hint">近9週 三大法人週買超（張）·紅買超綠賣超·下方為佔量%</div><div class="wkbar">'+bars+'</div></div>'
  +etfcard
  +'<div class="card"><h3>近5日三大法人明細（張）</h3><table><tr><th>日期</th><th>外資</th><th>投信</th><th>自營</th><th>合計</th><th>佔量%</th></tr>'+rows+'</table></div>';}
document.querySelectorAll('.sortb').forEach(function(b){b.onclick=function(){sortMode=b.getAttribute('data-m');
 document.querySelectorAll('.sortb').forEach(function(x){x.classList.toggle('on',x===b);});if(curSec)selSec(curSec);};});
etfSummary();secs();if(D.order.length)selSec(D.order[0]);
</script></body></html>
